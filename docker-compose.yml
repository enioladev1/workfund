services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-workfund}
      POSTGRES_USER: ${DB_USERNAME:-workfund}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workfund_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-workfund} -d ${DB_DATABASE:-workfund}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5,30,120", "--max-time=3600"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  storage_data:
